<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:sans-serif}
iframe{display:block;width:100%;height:100vh;border:0}
.top{position:fixed;top:8px;right:16px;z-index:10;display:flex;gap:8px}
.layer{display:none;position:fixed;top:50px;right:16px;z-index:11;background:#fff;border:1px solid #888;padding:16px;width:320px}
.layer.open{display:block}
.layer input[type=radio]{opacity:0;width:13px;height:13px;position:absolute}
</style></head><body>
<!-- ⚠️ 하네스: 발행 버튼은 iframe 밖 (이 문서를 쓴 환경 기준). 안쪽 변형은 ?pubInside=1 -->
<div class="top" id="top">
  <button class="draftcount">임시저장 <span id="dc">3</span></button>
  <button class="save_btn__bzc5B" data-click-area="tpb.save">저장</button>
  <button class="reserve">예약 발행 0건</button>
  <button data-click-area="tpb.publish" class="publish_btn__m9KHH">발행</button>
</div>
<div class="layer" id="layer">
  <div id="visbox">
    <span><input type="radio" name="open" id="open_public" value="2" checked><label for="open_public">전체공개</label></span>
    <span><input type="radio" name="open" id="open_neighbor" value="1"><label for="open_neighbor">이웃공개</label></span>
    <span><input type="radio" name="open" id="open_both_neighbor" value="3"><label for="open_both_neighbor">서로이웃공개</label></span>
    <span><input type="radio" name="open" id="open_private" value="0"><label for="open_private">비공개</label></span>
  </div>
  <button data-click-area="tpb*i.publish" class="confirm_btn__WEaBq">발행</button>
</div>
<iframe id="mainFrame" name="mainFrame"></iframe>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('mainFrame').src = '/editor.html' + location.search;
window.__reserveClicks = 0;
document.querySelector('.reserve').onclick = () => { location.href = '/reserved'; };
if (q.get('novis')) document.getElementById('visbox').remove();
document.querySelector("[data-click-area='tpb.publish']").onclick = () => { window.__publishOpened = 1; document.getElementById('layer').classList.add('open'); };
window.__countClicks = 0;
document.querySelector('.draftcount').onclick = () => window.__countClicks++;
document.querySelector("[data-click-area='tpb.save']").onclick = () => {
  const dc = document.getElementById('dc'); dc.textContent = String(Number(dc.textContent) + 1);
  const t = document.createElement('div'); t.textContent = '임시저장 되었습니다'; t.style.cssText = 'position:fixed;bottom:80px;left:40%;background:#333;color:#fff;padding:8px;z-index:99';
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
};
document.querySelector("[data-click-area='tpb*i.publish']").onclick = () => {
  const v = document.querySelector('input[name=open]:checked')?.id || 'none';
  location.href = '/post/harness/223456789012?vis=' + v;
};
</script></body></html>
